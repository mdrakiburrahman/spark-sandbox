name: GCI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gci-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_GH_ACTION: "1"
  IMDS_ROUTER_PORT: "8080"
  IMDS_METADATA_ENDPOINT: "http://localhost:8080/metadata/instance?api-version=2025-04-07"
  IDENTITY_ENDPOINT: "http://localhost:8080/metadata/identity/oauth2/token"
  IDENTITY_HEADER: "local-dev-secret"
  UAMI_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
  UAMI_SUBSCRIPTION: "00000000-0000-0000-0000-000000000000"

jobs:
  gci-linux:
    runs-on: [self-hosted, spark-sandbox-azure]
    container:
      image: rakirahman.azurecr.io/devcontainer/spark:2d6281b13738c8576a232df9a708f5c083820105d8d3f6d4696c28aa99bb091e
      options: >-
        --cap-add=SYS_ADMIN
        --device=/dev/fuse
        --security-opt=apparmor:unconfined
        --add-host=host.docker.internal:host-gateway

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/auth
        with:
          imds-relay-url: ${{ secrets.IMDS_RELAY_URL }}
          imds-relay-sender-key: ${{ secrets.IMDS_RELAY_SENDER_KEY }}

      - name: "🧹 Clean Projects"
        run: npx nx run-many -t clean --all --parallel=3 --output-style=stream

      - name: "🔧 Init Projects"
        run: npx nx affected --base=origin/main -t init --parallel=3 --output-style=stream

      - name: "📦 Build Projects"
        run: npx nx affected --base=origin/main -t build --parallel=3 --configuration=ci --output-style=stream

      - name: "🧹 Lint Projects"
        run: npx nx affected --base=origin/main -t lint --parallel=3 --configuration=ci --verbose --output-style=stream

      - name: "🧪 Test Projects"
        run: npx nx affected --base=origin/main -t test --configuration=ci --verbose --output-style=stream

      - name: "📁 Verify No Untracked Files"
        run: npx nx fail-on-untracked-files
