[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spark-dbt"
version = "0.1.0"
description = 'dbt project for Fabric Spark and local runs'
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  { name = "Raki Rahman", email = "mdrakiburrahman@gmail.com" },
]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
skip-install = true
installer = "uv"
dependencies = [
  "dbt-core>=1.9,<2",
  "dbt-fabricspark==1.12.5",
  "azure-identity>=1.21.0",
  "azure-core>=1.33.0",
  "dbterd",
  "dbt-artifacts-parser",
  "sqlfluff",
  "sqlfluff-templater-dbt",
  "deltalake",
  "pyarrow",
  "dbt-runner-lib @ {root:uri}/../fabric/python/dbt-runner-lib",
]

[tool.hatch.envs.default.env-vars]
UV_PRERELEASE = "allow"

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://github.com/mdrakiburrahman/spark-sandbox#readme"
Issues = "https://github.com/mdrakiburrahman/spark-sandbox/issues"
Source = "https://github.com/mdrakiburrahman/spark-sandbox"
