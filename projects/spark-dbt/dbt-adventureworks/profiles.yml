adventureworks:
  target: local-local
  outputs:
    # Lint-only static target (no Spark connection required for sqlfluff dbt templater)
    lint:
      authentication: cli
      method: livy
      livy_mode: local
      connect_retries: 0
      retry_all: false
      http_timeout: 5
      statement_timeout: 5
      lakehouse: dbt_adventureworks_dwh
      schema: dbt_adventureworks_dwh
      threads: 4
      type: fabricspark
      spark_config:
        name: dbt-adventureworks

    # Local dbt client + Local spark server (default for development)
    local-local:
      authentication: cli
      method: livy
      livy_mode: local
      session_id_file: /workspaces/spark-sandbox/projects/spark-dbt/livy-session-id.txt
      connect_retries: 25
      connect_timeout: 10
      lakehouse: dbt_adventureworks_dwh
      schema: dbt_adventureworks_dwh
      threads: 12
      type: fabricspark
      retry_all: true
      spark_config:
        name: dbt-adventureworks

    # Local dbt client + Fabric spark server
    local-fabric:
      authentication: cli
      method: livy
      livy_mode: fabric
      session_id_file: /workspaces/spark-sandbox/projects/spark-dbt/livy-session-id.txt
      connect_retries: 25
      connect_timeout: 10
      endpoint: https://api.fabric.microsoft.com/v1
      workspaceid: 3ea60ae5-e979-4d31-a317-66491ab497fb
      lakehouseid: 35800137-d4ac-4f28-8d63-84040cc83f21
      lakehouse: dbt_adventureworks_dwh
      schema: dbt_adventureworks_dwh
      threads: 12
      type: fabricspark
      retry_all: true
      spark_config:
        name: dbt-adventureworks
        conf:
          spark.fabric.environmentDetails: '{"id": "{{ env_var(''FABRIC_ENVIRONMENT_ID'', ''f704ad90-bc71-447f-abb7-69a0716a00d2'') }}"}'

    # Fabric dbt client + Fabric spark server
    fabric-fabric:
      authentication: fabric_notebook
      method: livy
      livy_mode: fabric
      session_id_file: /tmp/dbt-fabric-bundle/projects/dbt-adventureworks/livy-session-id.txt
      connect_retries: 1
      connect_timeout: 60
      endpoint: https://api.fabric.microsoft.com/v1
      workspaceid: 3ea60ae5-e979-4d31-a317-66491ab497fb
      lakehouseid: 35800137-d4ac-4f28-8d63-84040cc83f21
      lakehouse: dbt_adventureworks_dwh
      schema: dbt_adventureworks_dwh
      threads: 12
      type: fabricspark
      retry_all: true
      spark_config:
        name: dbt-adventureworks
        conf:
          spark.fabric.environmentDetails: '{"id": "{{ env_var(''FABRIC_ENVIRONMENT_ID'', ''f704ad90-bc71-447f-abb7-69a0716a00d2'') }}"}'
