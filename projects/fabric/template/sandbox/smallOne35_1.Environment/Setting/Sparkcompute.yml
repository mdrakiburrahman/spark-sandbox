enable_native_execution_engine: false
instance_pool_id: 00000000-0000-0000-0000-000000000001
driver_cores: 4
driver_memory: 28g
executor_cores: 4
executor_memory: 28g
dynamic_executor_allocation:
  enabled: true
  min_executors: 1
  max_executors: 1
spark_conf:
  spark.sql.parquet.vorder.default: false
  spark.driver.extraJavaOptions: -Xss128m
  spark.driver.maxResultSize: "0"
  spark.executor.extraJavaOptions: -Xss128m
  spark.memory.offHeap.enabled: "true"
  spark.memory.offHeap.size: 2560m
  spark.sql.hive.convertMetastoreParquet: "false"
  spark.sql.shuffle.partitions: "500"
  spark.sql.streaming.maxBatchesToRetainInMemory: "0"
  spark.sql.streaming.minBatchesToRetain: "25"
  spark.sql.streaming.stateStore.maintenanceInterval: 30s
  spark.sql.streaming.stateStore.minDeltasForSnapshot: "2"
  spark.sql.streaming.stateStore.providerClass: org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
  spark.sql.streaming.stateStore.rocksdb.compactOnCommit: "true"
  spark.extraListeners: io.openlineage.spark.agent.OpenLineageSparkListener
  spark.openlineage.transport.type: http
  spark.openlineage.transport.url: http://localhost:19001
  spark.plugins: me.rakirahman.spark.plugin.httpdumperplugin.HttpDumperPlugin
  spark.plugin.conf.driver.port: 19001
  spark.plugin.conf.json.location: Files/onelake/raw/openlineage
  spark.jars: abfss://3ea60ae5-e979-4d31-a317-66491ab497fb@msit-onelake.dfs.fabric.microsoft.com/4d8783be-e822-46d0-82e4-9b77c7f33992/Files/onelake/jars/commonExecutor.jar
runtime_version: 1.3
